name: Production Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Build & Push Production OCI Images to GHCR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to Deploy"
        required: true
        default: "prod"

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Image Updates to Production Cluster
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH || '/home/server/apps/dextaafrica/infra/prod' }}"
            echo "==> Initiating production deployment at $DEPLOY_PATH..."
            cd "$DEPLOY_PATH"
            make deploy
