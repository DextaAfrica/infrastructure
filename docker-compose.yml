services:
  # ============================================================================
  # 1. Edge Reverse Proxy & Ingress Gateway (Traefik v3)
  # ============================================================================
  traefik:
    image: traefik:v3.2
    container_name: dexta_traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - SSL_EMAIL=${SSL_EMAIL:-devops@dextaafrica.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/acme:/etc/traefik/acme
    networks:
      - dexta_network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. Branded 503 Maintenance Page Service
  # ============================================================================
  maintenance-page:
    build:
      context: ./docker/maintenance
      dockerfile: Dockerfile
    container_name: dexta_maintenance
    restart: unless-stopped
    networks:
      - dexta_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.maintenance-service.loadbalancer.server.port=80"

  # ============================================================================
  # 3. Postfix Mail Relay (Authenticated via Brevo / Sendinblue)
  # ============================================================================
  postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    container_name: dexta_postfix
    restart: unless-stopped
    environment:
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT:-587}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER:-}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY:-}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-${DOMAIN:-dextaafrica.com}}
      - POSTFIX_ALLOWED_NETWORKS=${POSTFIX_ALLOWED_NETWORKS:-}
    volumes:
      - postfix_spool:/var/spool/postfix
    networks:
      - dexta_network
    healthcheck:
      test: ["CMD-SHELL", "postfix status || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 4. Go Enterprise Core Backend API
  # ============================================================================
  backend:
    build:
      context: ${BACKEND_PATH:-./services/backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    container_name: dexta_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-dexta}:${POSTGRES_PASSWORD:-dexta_secret_2026}@postgres:5432/${POSTGRES_DB:-dexta_prod}?sslmode=disable}
      - DATABASE_AUTO_MIGRATE=true
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_TTL=${JWT_ACCESS_TOKEN_TTL:-24h}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:-dextaafrica.com},https://${WWW_DOMAIN:-www.dextaafrica.com},https://${ADMIN_DOMAIN:-admin.dextaafrica.com},https://${OPS_DOMAIN:-ops.dextaafrica.com}}
      - FRONTEND_REVALIDATE_URL=http://frontend:3000/api/revalidate
      - FRONTEND_REVALIDATE_SECRET=${FRONTEND_REVALIDATE_SECRET}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_REGION=${STORAGE_REGION:-auto}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
      - SMTP_HOST=postfix
      - SMTP_PORT=587
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      postfix:
        condition: service_healthy
    networks:
      - dexta_network
    labels:
      - "traefik.enable=true"
      # Subdomain API routing: api.dextaafrica.com
      - "traefik.http.routers.backend-subdomain.rule=Host(`${API_DOMAIN:-api.dextaafrica.com}`)"
      - "traefik.http.routers.backend-subdomain.entrypoints=websecure"
      - "traefik.http.routers.backend-subdomain.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-subdomain.middlewares=secHeaders@file,compressAll@file,rateLimitApi@file"
      # Path routing: dextaafrica.com/api/
      - "traefik.http.routers.backend-path.rule=(Host(`${DOMAIN:-dextaafrica.com}`) || Host(`${WWW_DOMAIN:-www.dextaafrica.com}`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-path.entrypoints=websecure"
      - "traefik.http.routers.backend-path.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-path.middlewares=secHeaders@file,compressAll@file,rateLimitApi@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # 5. Next.js High-Performance Frontend Web App
  # ============================================================================
  frontend:
    build:
      context: ${FRONTEND_PATH:-./services/frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.prod}
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${DOMAIN:-dextaafrica.com}}
        - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL:-https://${API_DOMAIN:-api.dextaafrica.com}}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    container_name: dexta_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${DOMAIN:-dextaafrica.com}}
      - BACKEND_API_URL=http://backend:8080
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL:-https://${API_DOMAIN:-api.dextaafrica.com}}
      - CONTENT_REVALIDATION_SECRET=${FRONTEND_REVALIDATE_SECRET}
      - NEWSLETTER_WEBHOOK_URL=${NEWSLETTER_WEBHOOK_URL:-}
      - NEWSLETTER_WEBHOOK_TOKEN=${NEWSLETTER_WEBHOOK_TOKEN:-}
      - CONTACT_WEBHOOK_URL=${CONTACT_WEBHOOK_URL:-}
      - CONTACT_WEBHOOK_TOKEN=${CONTACT_WEBHOOK_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dexta_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-dextaafrica.com}`) || Host(`${WWW_DOMAIN:-www.dextaafrica.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=secHeaders@file,compressAll@file,rateLimitGeneral@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================================
  # 6. Next.js Enterprise Operations & Admin Command Portal
  # ============================================================================
  admin-portal:
    build:
      context: ${ADMIN_PORTAL_PATH:-./services/admin-portal}
      dockerfile: ${ADMIN_PORTAL_DOCKERFILE:-Dockerfile}
      args:
        - DATABASE_URL=${ADMIN_DATABASE_URL:-file:/app/prisma/admin_portal.db}
        - APP_SECRET=${ADMIN_APP_SECRET}
    container_name: dexta_admin_portal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${ADMIN_DATABASE_URL:-file:/app/prisma/admin_portal.db}
      - APP_SECRET=${ADMIN_APP_SECRET}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.${DOMAIN:-dextaafrica.com}}
      - NEXT_PUBLIC_BASE_DOMAIN=${DOMAIN:-dextaafrica.com}
      - NEXT_PUBLIC_OPS_DOMAIN=${OPS_DOMAIN:-ops.dextaafrica.com}
      - NEXT_PUBLIC_ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.dextaafrica.com}
      - NEXT_PUBLIC_APP_URL=https://${ADMIN_DOMAIN:-admin.dextaafrica.com}
      - BACKEND_API_URL=http://backend:8080
      - BACKEND_JWT_SECRET=${JWT_SECRET}
      - INITIAL_ADMIN_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
      - ADMIN_REGISTRATION_PASSCODE=${ADMIN_REGISTRATION_PASSCODE}
      - AUTO_MIGRATE=true
      - AUTO_SEED=true
      # Postfix Local Relay Integration
      - SMTP_HOST=postfix
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - EMAIL_FROM=${EMAIL_FROM:-operations@dextaafrica.com}
      - AWS_REGION=${AWS_REGION:-auto}
      - AWS_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET_NAME=${STORAGE_BUCKET:-}
      - AWS_ENDPOINT=${STORAGE_ENDPOINT:-}
    volumes:
      - admin_data:/app/prisma
    depends_on:
      backend:
        condition: service_healthy
      postfix:
        condition: service_healthy
    networks:
      - dexta_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:-admin.dextaafrica.com}`) || Host(`${OPS_DOMAIN:-ops.dextaafrica.com}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=adminSecHeaders@file,compressAll@file,largeBodyBuffering@file"
      - "traefik.http.services.admin-portal.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ============================================================================
  # 7. Production PostgreSQL Database (Optional when using Cloud Supabase)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dexta_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dexta_prod}
      - POSTGRES_USER=${POSTGRES_USER:-dexta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dexta_secret_2026}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dexta_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dexta} -d ${POSTGRES_DB:-dexta_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 8. Production Redis Cache & Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: dexta_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dexta_redis_secret_2026} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dexta_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dexta_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ==============================================================================
# Persistent Storage Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: dexta_postgres_data
  admin_data:
    name: dexta_admin_data
  redis_data:
    name: dexta_redis_data
  postfix_spool:
    name: dexta_postfix_spool

# ==============================================================================
# Isolated Enterprise Network
# ==============================================================================
networks:
  dexta_network:
    name: dexta_network
    driver: bridge
