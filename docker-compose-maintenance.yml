# ==============================================================================
# Dexta Africa Enterprise Maintenance Page Overlay
# Used during deployments: docker compose -f docker-compose-prod.yml -f docker-compose-maintenance.yml --env-file .env.prod up -d --force-recreate maintenance
# ==============================================================================

services:
  maintenance:
    image: nginx:alpine
    container_name: dexta_maintenance
    restart: "no"
    volumes:
      - ./prod/maintenance:/usr/share/nginx/html:ro
    networks:
      - traefik-public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # Top Priority Router (1000): Intercepts all traffic while maintenance is active
      - "traefik.http.routers.dexta-maintenance.rule=Host(`${DOMAIN:-dextaafrica.com}`) || Host(`${WWW_DOMAIN:-www.dextaafrica.com}`) || Host(`${ADMIN_DOMAIN:-admin.dextaafrica.com}`) || Host(`${OPS_DOMAIN:-ops.dextaafrica.com}`) || Host(`${API_DOMAIN:-api.dextaafrica.com}`)"
      - "traefik.http.routers.dexta-maintenance.priority=1000"
      - "traefik.http.routers.dexta-maintenance.entrypoints=websecure"
      - "traefik.http.routers.dexta-maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.services.dexta-maintenance.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
