server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Return HTTP 503 Service Unavailable so search engines, APIs, and browsers know this is temporary
    error_page 503 @maintenance;

    location / {
        return 503;
    }

    location @maintenance {
        # Retry-After header signals clients to re-check in 30 seconds
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Dexta-Maintenance "true" always;
        try_files /index.html =503;
    }

    # Lightweight healthcheck endpoint so orchestrators know the maintenance container itself is ready
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
