# ==============================================================================
# Mailcow Dockerized - Traefik v3 Reverse Proxy Override
# Place this file at: /home/server/apps/mailcow/docker-compose.override.yml
# ==============================================================================

services:
  nginx-mailcow:
    networks:
      - traefik-public
      - mailcow-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.mailcow.rule=Host(`mail.dextaafrica.com`) || Host(`autodiscover.dextaafrica.com`) || Host(`autoconfig.dextaafrica.com`)"
      - "traefik.http.routers.mailcow.entrypoints=websecure"
      - "traefik.http.routers.mailcow.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mailcow.middlewares=secHeaders@file,compressAll@file"
      - "traefik.http.services.mailcow.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
