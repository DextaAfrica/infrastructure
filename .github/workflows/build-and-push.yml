name: Build & Push Production OCI Images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom Image Tag (e.g. v1.2.0 or rc-1)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

concurrency:
  group: build_and_push_${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-api:
    name: Build & Publish API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: DextaAfrica/Backend
          ref: main
          token: ${{ secrets.GH_PAT || secrets.ACTIONS_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          path: Backend

      - name: Determine Docker Context
        id: ctx
        run: |
          if [ -f "./Backend/Backend/Dockerfile" ]; then
            echo "context=./Backend/Backend" >> $GITHUB_OUTPUT
            echo "file=./Backend/Backend/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f "./Backend/Dockerfile" ]; then
            echo "context=./Backend" >> $GITHUB_OUTPUT
            echo "file=./Backend/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=./Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/dextaafrica/backend
            ghcr.io/dextaafrica/dexta-api
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-and-push-frontend:
    name: Build & Publish Frontend Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          repository: DextaAfrica/Frontend
          ref: main
          token: ${{ secrets.GH_PAT || secrets.ACTIONS_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          path: Frontend

      - name: Determine Docker Context
        id: ctx
        run: |
          if [ -f "./Frontend/Dockerfile.prod" ]; then
            echo "context=./Frontend" >> $GITHUB_OUTPUT
            echo "file=./Frontend/Dockerfile.prod" >> $GITHUB_OUTPUT
          elif [ -f "./Frontend/Dockerfile" ]; then
            echo "context=./Frontend" >> $GITHUB_OUTPUT
            echo "file=./Frontend/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=./Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/dextaafrica/frontend
            ghcr.io/dextaafrica/dexta-frontend
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-and-push-admin:
    name: Build & Publish Admin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Admin Portal Code
        uses: actions/checkout@v4
        with:
          repository: DextaAfrica/Admin-portal
          ref: main
          token: ${{ secrets.GH_PAT || secrets.ACTIONS_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          path: Admin-portal

      - name: Determine Docker Context
        id: ctx
        run: |
          if [ -f "./Admin-portal/Dockerfile" ]; then
            echo "context=./Admin-portal" >> $GITHUB_OUTPUT
            echo "file=./Admin-portal/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f "./Admin-portal/Dockerfile.prod" ]; then
            echo "context=./Admin-portal" >> $GITHUB_OUTPUT
            echo "file=./Admin-portal/Dockerfile.prod" >> $GITHUB_OUTPUT
          else
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=./Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/dextaafrica/admin-portal
            ghcr.io/dextaafrica/dexta-admin
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
